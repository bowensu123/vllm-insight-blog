[project]
name = "vllm-insights"
version = "0.1.0"
description = "GitHub insights tool for vllm-project/vllm: releases, PRs, commits, tech trends"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "streamlit>=1.36",
    "plotly>=5.22",
    "rich>=13.7",
    "typer>=0.12",
    "anthropic>=0.39",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
vllm-insights = "vllm_insights.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Let pytest import the package straight from src/ without an editable install.
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Pragmatic default set: pyflakes (F), pycodestyle errors (E), warnings (W),
# isort (I), bugbear (B), pyupgrade (UP).
select = ["E", "W", "F", "I", "B", "UP"]
# E501 (line length) is handled by the formatter; B008 trips on Typer's
# Option()-in-default pattern which is idiomatic here.
ignore = ["E501", "B008"]

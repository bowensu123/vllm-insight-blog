name: Weekly sync & publish

on:
  schedule:
    - cron: "0 8 * * 1"    # weekly — every Monday 08:00 UTC (change the day/time here)
  workflow_dispatch:
    inputs:
      full:
        description: "Full refresh (ignore last_synced_at)"
        type: boolean
        default: false

# Needed for actions/deploy-pages
permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: vllm-insights-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # GitHub auto-injects a fresh GITHUB_TOKEN per run; it has plenty of
      # quota for everything we do (public-repo reads + models:read +
      # writing to this repo). The old GH_DATA_TOKEN override was useful for
      # bumping rate limits but caused 401s once the PAT expired, so we no
      # longer fall back to it. To re-enable: add `${{ secrets.GH_DATA_TOKEN
      # }}` here and make sure the PAT is current.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: vllm-project/vllm
      DB_PATH: ./data/insights.sqlite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: data/insights.sqlite
          key: vllm-insights-db-${{ github.run_id }}
          restore-keys: |
            vllm-insights-db-

      # Durable backup of last resort: if the (evictable) cache missed, restore
      # the accumulated history from the `data` branch backup. Without this, a
      # cache eviction would silently reset all historical insights to zero.
      - name: Restore DB from data branch (cache-miss fallback)
        run: |
          if [ ! -f data/insights.sqlite ]; then
            echo "SQLite cache missed — trying the data-branch backup."
            git fetch --depth=1 origin data 2>/dev/null || true
            if git cat-file -e origin/data:insights.sqlite.gz 2>/dev/null; then
              mkdir -p data
              git show origin/data:insights.sqlite.gz | gunzip > data/insights.sqlite
              echo "Restored DB from data-branch backup."
            else
              echo "No data-branch backup yet — starting fresh."
            fi
          else
            echo "Using cached SQLite."
          fi

      - name: Sync (releases / PRs / commits / issues / forks / registry / source-scan)
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            vllm-insights sync --all --full
          else
            vllm-insights sync --all
          fi

      - name: Analyze (links / perf-claims / release-drift / embeddings / clustering)
        env:
          # Embeddings use GitHub Models (text-embedding-3-small via GITHUB_TOKEN).
          # Cluster labeling uses Anthropic Claude — set ANTHROPIC_API_KEY in repo
          # secrets to enable LLM labels; falls back to heuristic labels if absent.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          vllm-insights analyze --pr-issue-links --perf-claims --release-diff || \
            echo "core analyses failed; continuing"
          vllm-insights analyze --embed --cluster || \
            echo "embed/cluster failed; continuing"

      - name: Weekly themed digest (LLM)
        env:
          # Alibaba Bailian / DashScope (OpenAI-compatible). Set DASHSCOPE_API_KEY
          # in repo secrets. Model defaults to qwen3.7-max; override via LLM_MODEL.
          LLM_BACKEND: bailian
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          mkdir -p docs/weekly
          vllm-insights digest --out docs/weekly/latest.md --days 7 --llm
          # Persist a dated archive copy keyed by ISO week so history grows
          # one file per week instead of one per day.
          ISOWEEK=$(date -u +%G-W%V)
          cp docs/weekly/latest.md "docs/weekly/${ISOWEEK}.md"

      - name: Summarize latest release (LLM, cached)
        env:
          LLM_BACKEND: bailian
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          vllm-insights summarize-release --tag latest || \
            echo "Release summary failed; continuing"

      - name: Build static site
        run: vllm-insights site --docs docs

      # Commit the weekly markdown + index so the history is browsable on main.
      # The HTML dashboard goes to Pages via artifact upload (not committed).
      - name: Commit weekly digest
        run: |
          git config user.name "vllm-insights-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/weekly/*.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "digest: weekly themed activity $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No digest changes to commit."
          fi

      # Email the weekly digest privately via SMTP directly to your mailbox.
      # Nothing is posted publicly — no GitHub issue, no repo-watcher notifications,
      # and @mentions / #refs in the body are inert text in an email (they can't
      # ping anyone). Configure these repo secrets to enable it (leave unset to
      # silently skip):
      #   SMTP_HOST, SMTP_USERNAME, SMTP_PASSWORD, MAIL_TO   (required)
      #   SMTP_PORT (default 465), SMTP_SECURITY (ssl|starttls|plain), MAIL_FROM
      # Gated to at most once every MIN_DAYS days via a sentinel inside the DB.
      # With a weekly cron, MIN_DAYS=6 means the scheduled run always emails while
      # a manual same-week re-trigger won't double-send.
      - name: Email weekly digest via SMTP
        env:
          MIN_DAYS: "6"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          export TODAY=$(date -u +%Y-%m-%d)
          export DB=data/insights.sqlite
          # Send at most once every $MIN_DAYS days. The sentinel lives INSIDE the
          # SQLite DB (sync_state, entity 'email_sentinel') because only the DB is
          # reliably persisted (actions/cache + data-branch backup + restore
          # fallback). Runtime values are passed via the environment and read with
          # os.environ + parameterized SQL — never interpolated into Python source.
          export LAST=$(python -c 'import os,sqlite3; r=sqlite3.connect(os.environ["DB"]).execute("SELECT last_synced_at FROM sync_state WHERE entity=?",("email_sentinel",)).fetchone(); print(r[0] if r else "")' 2>/dev/null || echo "")
          SEND=$(python -c 'import os,datetime; last=os.environ["LAST"].strip(); print("1" if not last or (datetime.date.fromisoformat(os.environ["TODAY"])-datetime.date.fromisoformat(last)).days>=int(os.environ["MIN_DAYS"]) else "0")' 2>/dev/null || echo "1")
          echo "email gate: LAST='${LAST}' MIN_DAYS=${MIN_DAYS} -> SEND=${SEND}"
          if [ "$SEND" != "1" ]; then
            echo "Last emailed ${LAST:-never}; fewer than $MIN_DAYS day(s) ago — skipping"
            exit 0
          fi
          if [ ! -f docs/weekly/latest.md ]; then
            echo "No digest found; skipping"
            exit 0
          fi
          # email-digest exits 0=sent, 2=not configured (skip), 1=send error.
          set +e
          vllm-insights email-digest --path docs/weekly/latest.md
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            # The mail is already out; a bookkeeping failure here must NOT fail the
            # step (errexit) nor leave the sentinel unwritten (would re-send), hence
            # the trailing guard.
            python -c 'import os,sqlite3; c=sqlite3.connect(os.environ["DB"]); c.execute("INSERT INTO sync_state(entity,last_synced_at) VALUES(?,?) ON CONFLICT(entity) DO UPDATE SET last_synced_at=excluded.last_synced_at",("email_sentinel",os.environ["TODAY"])); c.commit(); c.close()' \
              || echo "WARNING: sentinel write failed (email already sent; may re-send next run)"
            echo "Sent and recorded email sentinel = $TODAY"
          elif [ "$rc" = "2" ]; then
            echo "SMTP not configured; not marking sentinel."
          else
            echo "Email send failed (rc=$rc); not marking sentinel so it retries next run."
          fi

      # Observability: if the digest could not produce its LLM section (and had no
      # cached fallback), alert so failures don't pass silently. Strictly private:
      # a private SMTP email if configured, otherwise just a log line / red step.
      # We deliberately do NOT create any GitHub issue (which would surface to repo
      # watchers). Runs even if earlier steps failed.
      - name: Alert on digest failure
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ ! -f docs/weekly/latest.md ] || ! grep -q "LLM digest skipped" docs/weekly/latest.md; then
            echo "Digest OK — no alert."
            exit 0
          fi
          BODY="The weekly digest could not generate its LLM section on $(date -u +%F) (run $RUN_ID). Check the DASHSCOPE_API_KEY secret and the 'Weekly themed digest' step logs."
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$MAIL_TO" ]; then
            ALERT_BODY="$BODY" python - <<'PY' || echo "alert email failed (non-fatal)"
          import os
          from vllm_insights.mailer import send_digest
          send_digest("**vLLM digest pipeline alert**\n\n" + os.environ["ALERT_BODY"],
                      "⚠️ vLLM digest is failing")
          print("Alerted via email.")
          PY
          else
            echo "::warning::$BODY"
            echo "SMTP not configured — logged the alert only (no GitHub issue created)."
          fi

      # Durable DB backup: push a gzipped snapshot to a single-commit `data`
      # branch (orphan each time, so binary history never bloats the repo). This
      # is the source the cache-miss fallback restores from. Best-effort.
      - name: Back up DB to data branch
        if: always()
        run: |
          [ -f data/insights.sqlite ] || { echo "No DB to back up."; exit 0; }
          gzip -c data/insights.sqlite > insights.sqlite.gz
          git config user.name "vllm-insights-bot"
          git config user.email "bot@users.noreply.github.com"
          tmp=$(mktemp -d)
          git worktree add --detach "$tmp" >/dev/null 2>&1 || { echo "worktree failed"; exit 0; }
          (
            cd "$tmp"
            git checkout --orphan data-snapshot >/dev/null 2>&1
            git rm -rf . >/dev/null 2>&1 || true
            cp "$GITHUB_WORKSPACE/insights.sqlite.gz" .
            git add insights.sqlite.gz
            git commit -m "data: snapshot $(date -u +%FT%TZ)" >/dev/null 2>&1 || exit 0
            git push -f origin data-snapshot:data
          ) || echo "DB backup push failed (non-fatal)."
          git worktree remove --force "$tmp" 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Upload SQLite as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: insights-db-${{ github.run_id }}
          path: data/insights.sqlite
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

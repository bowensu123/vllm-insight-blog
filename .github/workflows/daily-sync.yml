name: Daily sync & publish

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours, top of the hour UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Full refresh (ignore last_synced_at)"
        type: boolean
        default: false

# Needed for actions/deploy-pages
permissions:
  contents: write
  pages: write
  id-token: write
  models: read
  issues: write   # create the daily digest issue that GitHub emails to the assignee

concurrency:
  group: vllm-insights-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # GitHub auto-injects a fresh GITHUB_TOKEN per run; it has plenty of
      # quota for everything we do (public-repo reads + models:read +
      # writing to this repo). The old GH_DATA_TOKEN override was useful for
      # bumping rate limits but caused 401s once the PAT expired, so we no
      # longer fall back to it. To re-enable: add `${{ secrets.GH_DATA_TOKEN
      # }}` here and make sure the PAT is current.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: vllm-project/vllm
      DB_PATH: ./data/insights.sqlite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: data/insights.sqlite
          key: vllm-insights-db-${{ github.run_id }}
          restore-keys: |
            vllm-insights-db-

      # Durable backup of last resort: if the (evictable) cache missed, restore
      # the accumulated history from the `data` branch backup. Without this, a
      # cache eviction would silently reset all historical insights to zero.
      - name: Restore DB from data branch (cache-miss fallback)
        run: |
          if [ ! -f data/insights.sqlite ]; then
            echo "SQLite cache missed — trying the data-branch backup."
            git fetch --depth=1 origin data 2>/dev/null || true
            if git cat-file -e origin/data:insights.sqlite.gz 2>/dev/null; then
              mkdir -p data
              git show origin/data:insights.sqlite.gz | gunzip > data/insights.sqlite
              echo "Restored DB from data-branch backup."
            else
              echo "No data-branch backup yet — starting fresh."
            fi
          else
            echo "Using cached SQLite."
          fi

      - name: Sync (releases / PRs / commits / issues / forks / registry / source-scan)
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            vllm-insights sync --all --full
          else
            vllm-insights sync --all
          fi

      - name: Analyze (links / perf-claims / release-drift / embeddings / clustering)
        env:
          # Embeddings use GitHub Models (text-embedding-3-small via GITHUB_TOKEN).
          # Cluster labeling uses Anthropic Claude — set ANTHROPIC_API_KEY in repo
          # secrets to enable LLM labels; falls back to heuristic labels if absent.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          vllm-insights analyze --pr-issue-links --perf-claims --release-diff || \
            echo "core analyses failed; continuing"
          vllm-insights analyze --embed --cluster || \
            echo "embed/cluster failed; continuing"

      - name: Weekly themed digest (LLM)
        env:
          # Alibaba Bailian / DashScope (OpenAI-compatible). Set DASHSCOPE_API_KEY
          # in repo secrets. Model defaults to qwen3.7-max; override via LLM_MODEL.
          LLM_BACKEND: bailian
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          mkdir -p docs/weekly
          vllm-insights digest --out docs/weekly/latest.md --days 7 --llm
          # Persist a dated archive copy keyed by ISO week so history grows
          # one file per week instead of one per day.
          ISOWEEK=$(date -u +%G-W%V)
          cp docs/weekly/latest.md "docs/weekly/${ISOWEEK}.md"

      - name: Summarize latest release (LLM, cached)
        env:
          LLM_BACKEND: bailian
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          vllm-insights summarize-release --tag latest || \
            echo "Release summary failed; continuing"

      - name: Build static site
        run: vllm-insights site --docs docs

      # Commit the weekly markdown + index so the history is browsable on main.
      # The HTML dashboard goes to Pages via artifact upload (not committed).
      - name: Commit weekly digest
        run: |
          git config user.name "vllm-insights-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/weekly/*.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "digest: weekly themed activity $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No digest changes to commit."
          fi

      # Email the weekly digest via GitHub's own notification system. We keep ONE
      # issue per ISO week ("📬 vLLM weekly digest — 2026-W23") assigned to the
      # repo owner; the first run of the week creates it, later days in the same
      # week add a comment. Both creation and comments fire a notification email
      # to the assignee, so the digest lands in the owner's inbox — no SMTP /
      # external service. Reusing one issue per week (instead of one per day)
      # keeps the tracker from filling up with hundreds of issues.
      #
      # Set your GitHub account notification email to subowen5@huawei.com
      # (Settings → Emails / Notifications) to receive it there. Gated to at most
      # once every MIN_DAYS days via a date sentinel persisted inside the DB.
      - name: Email weekly digest via GitHub notification (every 2 days)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          MIN_DAYS: "2"
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          ISOWEEK=$(date -u +%G-W%V)
          DB=data/insights.sqlite
          # Send at most once every $MIN_DAYS days. The sentinel lives INSIDE the
          # SQLite DB (sync_state, entity 'email_sentinel') because only the DB is
          # reliably persisted (actions/cache + data-branch backup + restore
          # fallback). The old loose file data/.last-emailed-day was NOT in the
          # cache path, so it vanished every run and the digest emailed on every
          # 3h build (~8/day).
          LAST=$(python -c "import sqlite3; r=sqlite3.connect('$DB').execute(\"SELECT last_synced_at FROM sync_state WHERE entity='email_sentinel'\").fetchone(); print(r[0] if r else '')" 2>/dev/null || echo "")
          SEND=$(python -c "import datetime; last='$LAST'.strip(); print('1' if not last or (datetime.date.fromisoformat('$TODAY')-datetime.date.fromisoformat(last)).days>=$MIN_DAYS else '0')" 2>/dev/null || echo "1")
          if [ "$SEND" != "1" ]; then
            echo "Last emailed $LAST; fewer than $MIN_DAYS day(s) ago — skipping"
            exit 0
          fi
          DIGEST=docs/weekly/latest.md
          if [ ! -f "$DIGEST" ]; then
            echo "No digest found; skipping"
            exit 0
          fi
          # Defang any bare @mentions so posting the digest into an issue doesn't
          # ping PR authors. Safety net on top of report.py already linking authors.
          BODY=$(mktemp)
          python -c "from vllm_insights.report import neutralize_mentions; import sys; sys.stdout.write(neutralize_mentions(open('$DIGEST', encoding='utf-8').read()))" > "$BODY"
          gh label create digest --color 1f6feb --description "Weekly digest notifications" 2>/dev/null || true
          TITLE="📬 vLLM weekly digest — $ISOWEEK"
          NUM=$(gh issue list --state all --search "in:title $TITLE" --json number,title \
                  -q ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          ok=0
          if [ -n "$NUM" ]; then
            { echo "Update for $TODAY:"; echo; cat "$BODY"; } | gh issue comment "$NUM" --body-file - && ok=1
            echo "Commented on issue #$NUM"
          else
            gh issue create --title "$TITLE" --body-file "$BODY" \
              --assignee "$OWNER" --label digest && ok=1
            echo "Created weekly digest issue"
          fi
          if [ "$ok" = "1" ]; then
            # Record today's date in the DB so the next 3h build won't re-email.
            python -c "import sqlite3;c=sqlite3.connect('$DB');c.execute(\"INSERT INTO sync_state(entity,last_synced_at) VALUES('email_sentinel',?) ON CONFLICT(entity) DO UPDATE SET last_synced_at=excluded.last_synced_at\",('$TODAY',));c.commit();c.close()"
            echo "Marked email sentinel = $TODAY"
          else
            echo "Notification failed; not marking sentinel so it retries next run"
          fi

      # Observability: if the digest could not produce its LLM section (and had no
      # cached fallback), open or update a single dedup'd alert issue so failures
      # don't pass silently. Runs even if earlier steps failed.
      - name: Alert on digest failure
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -f docs/weekly/latest.md ] && grep -q "LLM digest skipped" docs/weekly/latest.md; then
            gh label create digest --color 1f6feb 2>/dev/null || true
            TITLE="⚠️ Weekly digest LLM generation is failing"
            BODY="The weekly digest could not generate its LLM section on $(date -u +%F) (run ${{ github.run_id }}). Check the DASHSCOPE_API_KEY secret and the 'Weekly themed digest' step logs."
            NUM=$(gh issue list --state open --search "in:title $TITLE" --json number,title \
                    -q ".[] | select(.title==\"$TITLE\") | .number" | head -1)
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "$BODY" || true
            else
              gh issue create --title "$TITLE" --body "$BODY" --assignee "$OWNER" --label digest \
                || gh issue create --title "$TITLE" --body "$BODY" --assignee "$OWNER" || true
            fi
          else
            echo "Digest OK — no alert."
          fi

      # Durable DB backup: push a gzipped snapshot to a single-commit `data`
      # branch (orphan each time, so binary history never bloats the repo). This
      # is the source the cache-miss fallback restores from. Best-effort.
      - name: Back up DB to data branch
        if: always()
        run: |
          [ -f data/insights.sqlite ] || { echo "No DB to back up."; exit 0; }
          gzip -c data/insights.sqlite > insights.sqlite.gz
          git config user.name "vllm-insights-bot"
          git config user.email "bot@users.noreply.github.com"
          tmp=$(mktemp -d)
          git worktree add --detach "$tmp" >/dev/null 2>&1 || { echo "worktree failed"; exit 0; }
          (
            cd "$tmp"
            git checkout --orphan data-snapshot >/dev/null 2>&1
            git rm -rf . >/dev/null 2>&1 || true
            cp "$GITHUB_WORKSPACE/insights.sqlite.gz" .
            git add insights.sqlite.gz
            git commit -m "data: snapshot $(date -u +%FT%TZ)" >/dev/null 2>&1 || exit 0
            git push -f origin data-snapshot:data
          ) || echo "DB backup push failed (non-fatal)."
          git worktree remove --force "$tmp" 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Upload SQLite as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: insights-db-${{ github.run_id }}
          path: data/insights.sqlite
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

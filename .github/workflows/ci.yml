name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    # Advisory for now: the existing codebase predates ruff, so we report style
    # issues without failing the build. Flip continue-on-error off after a cleanup
    # pass (`ruff check --fix && ruff format`).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff>=0.6
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
